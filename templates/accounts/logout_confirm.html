{% extends 'accounts/base_auth.html' %}
{% block title %}Chiqish{% endblock %}
{% block content %}
<div style="text-align:center;margin-bottom:20px;">
    <i class="fa-solid fa-arrow-right-from-bracket" style="font-size:56px;color:var(--red);"></i>
</div>
<h2>Chiqishni Tasdiqlang</h2>
<p style="color:var(--muted);text-align:center;font-size:15px;margin-bottom:28px;">Haqiqatan ham tizimdan chiqmoqchimisiz?</p>
<form method="post" action="{% url 'accounts:logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn-auth" style="background:var(--red);margin-bottom:12px;">
        <i class="fa-solid fa-check"></i> Ha, chiqaman
    </button>
</form>
<a href="javascript:history.back()" class="btn-auth" style="background:var(--glass2);border:1px solid var(--border);color:var(--text);text-decoration:none;display:flex;">
    <i class="fa-solid fa-xmark"></i> Yo'q, qolaman
</a>
{% endblock %}
