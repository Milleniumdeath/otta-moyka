{% load static %}
<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050a0f">
  <title>Oflayn — OTTA Moyka</title>
  <link rel="icon" href="{% static 'pwa/favicon.png' %}">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#050a0f; color:#f0f8ff;
      font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      text-align:center; padding:24px;
    }
    .card {
      max-width:380px; background:rgba(15,30,45,0.55);
      border:1px solid rgba(0,200,255,0.14); border-radius:24px;
      padding:40px 28px; backdrop-filter:blur(8px);
    }
    img { width:96px; height:96px; margin-bottom:20px; }
    h1 { font-size:22px; font-weight:700; margin-bottom:10px; }
    p { color:#7aaabf; font-size:15px; line-height:1.6; margin-bottom:24px; }
    button {
      background:#00c8ff; color:#050a0f; border:0; border-radius:14px;
      padding:13px 28px; font-size:15px; font-weight:600; cursor:pointer;
      font-family:inherit;
    }
    button:active { transform:scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <img src="{% static 'pwa/icon-192.png' %}" alt="OTTA">
    <h1>Internet aloqasi yo'q</h1>
    <p>Hozircha tarmoqqa ulanib bo'lmadi. Ulanishni tekshirib, qaytadan urinib ko'ring.</p>
    <button onclick="location.reload()">Qayta urinish</button>
  </div>
</body>
</html>
