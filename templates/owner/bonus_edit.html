{% extends 'base/panel_base.html' %}
{% block title %}Bonusni Tahrirlash{% endblock %}
{% block page_title %}Bonusni Tahrirlash{% endblock %}
{% block sidebar_nav %}{% include 'owner/_sidebar.html' %}{% endblock %}
{% block content %}
<div class="form-card">
    <div class="form-card-title"><i class="fa-solid fa-pen-to-square"></i> Bonusni Tahrirlash</div>
    <form method="post" action="{% url 'owner:edit_bonus' bonus.pk %}" enctype="multipart/form-data">{% csrf_token %}
        <div class="form-row">
            <div class="form-group"><label class="form-label">Buyum nomi *</label>
                <input type="text" name="name" class="form-control" value="{{ bonus.name }}" required>
            </div>
            <div class="form-group"><label class="form-label">Narxi (tanga) *</label>
                <input type="number" name="token_cost" class="form-control" value="{{ bonus.token_cost }}" min="1" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Miqdori *</label>
                <input type="number" name="quantity" class="form-control" value="{{ bonus.quantity }}" min="1" required>
            </div>
            <div class="form-group"><label class="form-label">Yangi rasm</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>
        </div>
        <div class="form-group"><label class="form-label">Tavsif</label>
            <textarea name="description" class="form-control" rows="2">{{ bonus.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Saqlash</button>
    </form>
</div>
{% endblock %}
